<article class="case-card" *ngIf="caseItem"><div class="case-card__visual" [style.--case-accent]="caseItem.accent"><span>CASE PROVISÓRIO</span><b aria-hidden="true">{{ caseItem.id < 10 ? '0' + caseItem.id : caseItem.id }}</b></div><div class="case-card__content"><h2>{{ caseItem.title }}</h2><p>{{ caseItem.summary }}</p><span class="case-card__future">Detalhe em preparação para /cases/{{ caseItem.slug }}</span></div></article>

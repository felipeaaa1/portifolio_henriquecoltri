<section id="inicio" class="hero" (pointermove)="moveGlow($event)">
  <div class="hero__art" aria-hidden="true">
    <span class="hero__shape hero__shape--one"></span>
    <span class="hero__shape hero__shape--two"></span>
    <span class="hero__shape hero__shape--three"></span>
    <span class="hero__shape hero__shape--four"></span>
  </div>
  <div class="hero__glass" aria-hidden="true"></div>

  <div class="container hero__content" appReveal="clip">
    <p class="hero__eyebrow">Estratégia · Branding · Comunicação</p>
    <h1>Estratégia que<br><em>ganha forma.</em></h1>
    <div class="hero__intro">
      <p>Posicionamento, branding e comunicação para marcas que querem construir uma presença clara, consistente e reconhecível.</p>
      <a class="button button--accent" [href]="contactUrl" target="_blank" rel="noopener noreferrer">Vamos conversar <span aria-hidden="true">↘</span></a>
    </div>
  </div>
  <a class="hero__scroll" href="#posicionamento"><span aria-hidden="true">↓</span> continue</a>
</section>

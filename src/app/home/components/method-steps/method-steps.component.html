<section id="metodo" class="method section-dark"><div class="container"><app-section-title eyebrow="Método" title="Um processo para transformar intenção em presença." theme="dark"></app-section-title>
<ol class="method__grid"><li *ngFor="let step of steps"><span>{{ step.number }}</span><h3>{{ step.title }}</h3><p>{{ step.description }}</p></li></ol>

<section id="cases" class="featured section-light"><div class="container"><app-section-title eyebrow="Cases em destaque" title="Estratégia aplicada, forma em movimento." description="Projetos demonstrativos enquanto os cases reais são preparados."></app-section-title>
<div class="featured__grid"><article *ngFor="let caseItem of cases" class="case"><a routerLink="/cases" [attr.aria-label]="'Conhecer ' + caseItem.title"><div class="case__visual" [style.--case-accent]="caseItem.accent"><span>CASE</span></div><div class="case__body"><p>Projeto provisório</p><h3>{{ caseItem.title }}</h3><span>{{ caseItem.summary }}</span><b aria-hidden="true">↗</b></div></a></article></div>
<a class="button button--dark featured__cta" routerLink="/cases">Confira meus melhores cases <span aria-hidden="true">→</span></a></div></section>

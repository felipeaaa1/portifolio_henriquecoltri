<section class="testimonials section-light"><div class="container"><app-section-title appReveal="slide-left" eyebrow="Depoimentos" title="O trabalho também é feito de encontros."></app-section-title><div class="testimonial" *ngIf="testimonials.length" aria-live="polite" appReveal="slide-right"><span class="testimonial__quote" aria-hidden="true">“</span><blockquote>{{ testimonials[activeIndex].text }}</blockquote><p><strong>{{ testimonials[activeIndex].author }}</strong><br>{{ testimonials[activeIndex].role }}</p><div class="testimonial__controls"><button type="button" (click)="previous()" aria-label="Depoimento anterior">←</button><div role="group" aria-label="Escolher depoimento"><button *ngFor="let item of testimonials; let index = index" type="button" class="dot" [class.dot--active]="index === activeIndex" [attr.aria-label]="'Mostrar depoimento ' + (index + 1)" [attr.aria-current]="index === activeIndex ? 'true' : null" (click)="select(index)"></button></div><button type="button" (click)="next()" aria-label="Próximo depoimento">→</button></div></div><p class="testimonials__note">Depoimentos demonstrativos, aguardando conteúdo e autorização dos clientes.</p></div></section>

<footer class="footer">
  <div class="container footer__brand">
    <img
      src="assets/images/brand/logo-henrique-coltri-preto.svg"
      alt="Henrique Coltri"
    >
  </div>

  <div class="container footer__top">
    <div>
      <p class="footer__label">Navegue</p>
      <a routerLink="/">Home</a>
      <a routerLink="/cases">Cases</a>
      <a routerLink="/" fragment="contato">Contato</a>
    </div>

    <div>
      <p class="footer__label">Conecte-se</p>
      <app-social-links></app-social-links>
    </div>

    <div>
      <p class="footer__label">Contato</p>
      <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
      <a [href]="contactUrl">WhatsApp / contato</a>
    </div>
  </div>

  <div class="container footer__name" aria-label="Henrique Coltri">
    HENRIQUE<br>
    COLTRI
  </div>

  <div class="container footer__bottom">
  <span>Estratégia de marcas</span>
  <span>
    2026 · Todos os direitos reservados. Feito por Henrique Coltri e
    <a href="https://www.felipearnaud.com.br" target="_blank" rel="noopener noreferrer">Felipe Arnaud</a>
  </span>
</div>
</footer>

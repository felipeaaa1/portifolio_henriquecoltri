<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Henrique Coltri | Branding, Estratégia e Identidade Visual</title>
  <meta name="description" content="Branding estratégico, posicionamento e identidade visual para negócios que precisam transformar essência em uma marca clara, coerente e reconhecível.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Henrique Coltri">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png?v=1">

  <link
    id="site-favicon"
    rel="icon"
    type="image/svg+xml"
    href="assets/images/brand/favicon-dark.svg?v=4"
  >

  <script>
    const themeQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function updateFavicon(event) {
      const favicon = document.getElementById('site-favicon');

      favicon.href = event.matches
        ? 'assets/images/brand/favicon-light.svg?v=4'
        : 'assets/images/brand/favicon-dark.svg?v=4';
    }

    updateFavicon(themeQuery);

    if (themeQuery.addEventListener) {
      themeQuery.addEventListener('change', updateFavicon);
    } else {
      themeQuery.addListener(updateFavicon);
    }

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    window.scrollTo(0, 0);
  </script>
</head>

<body>
  <app-root></app-root>
</body>
</html>
